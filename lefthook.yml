# Local git hooks. Install once with `lefthook install`.
# Commands are defined in the Makefile; CI runs the same targets.

pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      run: |
        out=$(gofmt -l {staged_files})
        if [ -n "$out" ]; then
          echo "not gofmt-ed:"; echo "$out"; exit 1
        fi
    vet:
      glob: "*.go"
      run: go vet ./...

pre-push:
  commands:
    lint:
      run: make lint
    test:
      run: make test
